[package]
name = "promptly-rs"
version = "0.1.0"
edition = "2024"

[package.metadata.bundle]
name = "Promptly"
identifier = "com.promptly.app"
icon = ["assets/icon.icns", "assets/icon.ico"]

[dependencies]
gpui-kit = "0.10.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
regex = "1.13"
url = "2.5"
dirs = "6.0"
uuid = { version = "1.29", features = ["v4"] }
anyhow = "1.0"
thiserror = "2.0"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["NSApplication", "NSImage"] }
objc2-foundation = { version = "0.3.2", default-features = false, features = ["NSData", "NSObjCRuntime"] }

[dev-dependencies]
tempfile = "3.27"
